<!DOCTYPE html>
<html data-theme="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Log in | CampusFind</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link href="/assets/css/styles.css" rel="stylesheet" />
    <link href="/assets/css/logo-fixes.css" rel="stylesheet" />
  </head>
  <body>
    <div class="official-brand official-brand-top">
      <a aria-label="CampusFind homepage" href="/">
        <img alt="University of Regina logo" class="uofr-logo" src="/assets/images/uofr-logo.jpg" />
      </a>
    </div>
    <header class="site-header">
      <a class="campusfind-brand" href="/">
        <img alt="" class="campusfind-icon" src="/assets/images/campusfind-logo.svg" />
        <div>
          <h1>CampusFind</h1>
          <p class="brand-subtitle">Campus lost-and-found portal</p>
        </div>
      </a>
      <div class="header-actions">
        <a class="admin-link" href="/admin-login.html">Admin login</a>
        <div class="contact-pill">306-585-4407</div>
        <button class="theme-toggle" data-theme-toggle="" type="button">
          <span aria-hidden="true">◐</span>
        </button>
      </div>
    </header>
    <main id="main-content">
      <section class="shell auth-shell">
        <div class="card section-card auth-card narrow-card">
          <p class="eyebrow">User login</p>
          <h2>Log in to report a lost item</h2>
          <p>Use your account to submit a report and view your recent requests.</p>
          <form class="form-grid auth-panel single-panel" id="login-form" novalidate="">
            <label>
              <span>Email</span>
              <input autocomplete="email" name="email" placeholder="name@example.com" required="" type="email" />
            </label>
            <label>
              <span>Password</span>
              <input autocomplete="current-password" minlength="8" name="password" required="" type="password" />
            </label>
            <button class="btn btn-primary full" type="submit">Log in</button>
            <p class="switch-auth">No account? <a href="/signup.html">Create one</a>
            </p>
          </form>
        </div>
      </section>
    </main>
    <footer class="site-footer shell">
      <div class="footer-brand">
        <img alt="University of Regina Protective Services logo" class="ps-logo" src="/assets/images/protectiveservice-logo.png" />
        <h3>CampusFind</h3>
        <p>School project prototype</p>
      </div>
      <div class="footer-contact">
        <p>
          <a href="/">Back to homepage</a>
        </p>
      </div>
    </footer>
    <script defer="" src="/assets/js/theme.js"></script>
    <script src="/assets/js/auth.js" type="module"></script>
  </body>
</html>
