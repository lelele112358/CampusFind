<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | CampusFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div class="official-brand">
        <img src="https://www.uregina.ca/communications-marketing/assets/visual-identity/Primary_Logo/Full%20Colour/primary-logo-680x270.jpg"
             alt="University of Regina logo" class="uofr-logo" />
      </div>
  <header class="site-header">
    <a class="campusfind-brand" href="/"><img class="campusfind-icon" src="/assets/images/campusfind-logo.svg" alt=""><div><h1>CampusFind</h1><p class="brand-subtitle">Campus lost-and-found portal</p></div></a>
    <div class="header-actions"><a href="/admin-login.html" class="admin-link">Admin login</a><div class="contact-pill">306-585-4407</div><button class="theme-toggle" type="button" data-theme-toggle><span aria-hidden="true">◐</span></button></div>
  </header>
  <main id="main-content"><section class="shell auth-shell"><div class="card section-card auth-card narrow-card">
    <p class="eyebrow">User login</p><h2>Log in to report a lost item</h2><p>Use your account to submit a report and view your recent requests.</p>
    <form class="form-grid auth-panel single-panel" id="login-form" novalidate>
      <label><span>Email</span><input type="email" name="email" autocomplete="email" placeholder="name@example.com" required></label>
      <label><span>Password</span><input type="password" name="password" autocomplete="current-password" minlength="8" required></label>
      <button type="submit" class="btn btn-primary full">Log in</button>
      <p class="switch-auth">No account? <a href="/signup.html">Create one</a></p>
    </form>
  </div></section></main>
  <footer class="site-footer shell"><div><h3>CampusFind</h3><p>School project prototype</p></div><div class="footer-contact"><p><a href="/">Back to homepage</a></p></div></footer>
  <script src="/assets/js/theme.js" defer></script><script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
